jobs:
  get-video:
    name: "📥 دانلود ویدیو"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    # --- ADDED JOB-LEVEL ENV ---
    env:
      YT_COOKIES_BASE64: ${{ secrets.YT_COOKIES_BASE64 }}
    # ---------------------------

    steps:
      # ... (your existing steps for Check URL, Checkout, Configure Git, WARP, Dependencies) ...

      # --- FIXED DECODE STEP ---
      - name: Decode YouTube Cookies
        if: ${{ env.YT_COOKIES_BASE64 != '' }}
        run: |
          echo "Decoding cookies..."
          echo "${{ env.YT_COOKIES_BASE64 }}" | base64 -d > cookies.txt
          echo "Cookies file created."
      # -------------------------

      - name: Download YouTube Video(s)
        env:
          # ... your other env vars ...
          YT_COOKIES_FILE: "cookies.txt"
        run: python3 scripts/video-get.py
      
      # ... (rest of your steps) ...
